name: push_nuget

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Package version (with or without a leading v)
        required: true
        type: string

jobs: 
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x.x"

      - name: Setup Nuget.exe
        uses: nuget/setup-nuget@v1

      - name: Build packages
        run: |
          dotnet build .\Nurbsy\Nurbsy.csproj --configuration Release --output .\Nurbsy\lib\net8.0
          dotnet build .\VL.Nurbsy\src\VL.Nurbsy.csproj --configuration Release --output .\VL.Nurbsy\lib\net8.0\

      - name: Extract version and detect pre-release
        id: version
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.version }}"
          } else {
            "${{ github.ref_name }}"
          }
          $cleanVersion = $version.TrimStart("v")

          $isPrerelease = $cleanVersion -match "-"

          echo "VERSION=$cleanVersion" >> $env:GITHUB_ENV
          echo "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_ENV

      - name: Pack packages
        run: |
          nuget pack .nuget\Nurbsy.nuspec -Version ${{ env.VERSION }} -OutputDirectory .\packages
          nuget pack .nuget\VL.Nurbsy.nuspec -Version ${{ env.VERSION }} -OutputDirectory .\packages

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: antokhio

      - name: Publish to NuGet.org
        run: |
          Write-Host "Publishing to NuGet.org..."
          foreach ($package in Get-ChildItem -Path ./packages -Filter *.nupkg) {
            dotnet nuget push $package.FullName `
              --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }

      - name: Upload artifacts
        uses: ncipollo/release-action@v1
        with:
          artifacts: packages/**
          generateReleaseNotes: true
          allowUpdates: true
          prerelease: ${{ env.IS_PRERELEASE == 'True' }}
          token: ${{ secrets.GITHUB_TOKEN }}